{% extends "base.html" %}

{% block title %}
    Register
{% endblock %}


{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h1>Register</h1>

        <form id="register-form">

            <div class="form-group">
                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                >
            </div>


            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    required
                >
            </div>


            <p
                id="error-message"
                class="error-message"
            ></p>


            <button
                type="submit"
                class="primary-button"
            >
                Register
            </button>

        </form>


        <p class="auth-link">
            Already have an account?

            <a href="{% url 'login-page' %}">
                Login
            </a>
        </p>

    </div>

</div>


<script>
    const form =
        document.getElementById("register-form");

    const errorMessage =
        document.getElementById("error-message");


    function getErrorMessage(data) {
        const firstKey =
            Object.keys(data)[0];

        if (!firstKey) {
            return "Registration failed.";
        }

        const value = data[firstKey];

        if (Array.isArray(value)) {
            return value[0];
        }

        return value;
    }


    form.addEventListener(
        "submit",
        async (event) => {
            event.preventDefault();

            errorMessage.textContent = "";

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;


            const response = await fetch(
                "/api/v1/auth/register/",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "same-origin",

                    body: JSON.stringify({
                        username,
                        password
                    })
                }
            );


            const data = await response.json();


            if (!response.ok) {
                errorMessage.textContent =
                    getErrorMessage(data);

                return;
            }


            window.location.href = "{% url 'login-page' %}";
        }
    );
</script>

{% endblock %}
